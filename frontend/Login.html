<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./login.css">

    <title>Login NB Gerenciador</title>
</head>

<body>
    <div id="bg-login">
        <figure>
            <img alt='logo nova bebidas' src="../assets/img/logo.png" />

        </figure>

        <form class="formulario">


            <h2>Acessar:</h2>

            <div class="card-user">
                <input type="text" name="" required>
                <label> Usuário</label>
            </div>
            <div class="card-user">

                <input type="password" name="" required>
                <label>Senha</label>

            </div>
            <div>
                <a href="#" class="forget">Esqueceu a senha?</a>
            </div>
            <div>
                <button class="btn-entrar">Entrar</button>
            </div>
            <div>
                <hr>
            </div>


        </form>
    </div><!--bg-log-->

</body>

</html>
